name: ai-image-generator
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # PyTorch with CUDA
  - pytorch=2.0.0
  - torchvision=0.15.0
  - pytorch-cuda=11.8
  
  # Python version
  - python=3.10
  
  # Image processing
  - pillow>=9.5.0
  - numpy>=1.24.0
  
  # Development tools
  - jupyter
  - ipython
  - ipywidgets
  
  # Testing
  - pytest
  - pytest-cov
  
  # Code formatting
  - black
  - flake8
  
  # Pip dependencies
  - pip
  - pip:
      - diffusers>=0.21.0
      - transformers>=4.30.0
      - deep-translator>=1.11.4
      - accelerate>=0.20.0
      - tqdm>=4.65.0
